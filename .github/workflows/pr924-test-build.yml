name: PR 924 Android Test Build

on:
  push:
  workflow_dispatch:

jobs:
  build-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build app and instrumentation tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run regression tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
